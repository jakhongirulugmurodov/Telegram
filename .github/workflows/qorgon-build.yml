# Qo'rg'on — 0a bosqichi: o'zgartirilmagan fork'ni GitHub Actions'da yig'ib,
# o'rnatiladigan APK olish. Maqsad: build zanjiri ishlashini isbotlash.
name: Qo'rg'on APK

on:
  workflow_dispatch:
  push:
    branches: [qorgon]
    paths-ignore:
      - '**.md'

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Kodni olish (submodullar bilan)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Diskda joy bo'shatish
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
                      "$AGENT_TOOLSDIRECTORY/Ruby" /usr/local/lib/android/sdk/ndk || true
          sudo apt-get clean
          df -h /

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: SDK komponentlari (Dockerfile'dagi aniq versiyalar)
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Gradle keshi
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Native (CMake) keshi
        uses: actions/cache@v4
        with:
          path: |
            TMessagesProj/.cxx
          key: cxx-${{ runner.os }}-${{ hashFiles('TMessagesProj/jni/CMakeLists.txt', 'gradle.properties') }}
          restore-keys: cxx-${{ runner.os }}-

      - name: Qo'rg'on API kalitini qo'yish
        env:
          # api_id maxfiy emas: u tarqatilgan har bir APK ichida ochiq turadi.
          # Telegram faqat api_hash'ni yashirishni talab qiladi.
          QORGON_APP_ID: "34749045"
          QORGON_APP_HASH: ${{ secrets.QORGON_APP_HASH }}
        run: |
          if [ -z "$QORGON_APP_HASH" ]; then
            echo "::warning::QORGON_APP_HASH secret'i yo'q."
            echo "::warning::Upstream'ning dummy kaliti bilan yig'iladi — faqat shaxsiy sinov uchun, oilaga tarqatmang."
            exit 0
          fi
          python3 - <<'PY'
          import os, re, pathlib
          p = pathlib.Path("TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java")
          s = p.read_text()
          app_id = os.environ["QORGON_APP_ID"].strip()
          app_hash = os.environ["QORGON_APP_HASH"].strip()
          assert app_id.isdigit(), "QORGON_APP_ID butun son bo'lishi kerak"
          assert re.fullmatch(r"[0-9a-fA-F]{32}", app_hash), "QORGON_APP_HASH 32 ta hex belgi bo'lishi kerak"
          s, n1 = re.subn(r"public static int APP_ID = \d+;",
                          "public static int APP_ID = %s;" % app_id, s, count=1)
          s, n2 = re.subn(r'public static String APP_HASH = "[^"]*";',
                          'public static String APP_HASH = "%s";' % app_hash, s, count=1)
          assert n1 == 1 and n2 == 1, "BuildVars.java kutilgan shaklda emas"
          p.write_text(s)
          print("APP_ID qo'yildi:", app_id)
          print("APP_HASH qo'yildi: (yashirin)")
          PY

      - name: APK yig'ish
        run: |
          chmod +x ./gradlew
          ./gradlew :TMessagesProj_AppStandalone:assembleAfatStandalone \
            --no-daemon --stacktrace

      - name: Natijani nomlash
        run: |
          SRC=TMessagesProj_AppStandalone/build/outputs/apk/afat/standalone/app.apk
          ls -la "$(dirname "$SRC")"
          mkdir -p out
          cp "$SRC" "out/qorgon-$(date +%Y%m%d)-${GITHUB_SHA::7}.apk"
          ls -la out

      - name: APK'ni yuklash
        uses: actions/upload-artifact@v4
        with:
          name: qorgon-apk
          path: out/*.apk
          retention-days: 30
